name: js-ashanti-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: js_ashanti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d js_ashanti_db"]
      interval: 5s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD}@db:5432/js_ashanti_db
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL:-http://localhost}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost}
      BACKEND_INTERNAL_URL: http://backend:4001
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
